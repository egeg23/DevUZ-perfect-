<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=1920, height=1080">
<script src="gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#05070b;font-family:Inter,sans-serif;color:#eaf0f7}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;
 background:radial-gradient(1200px 700px at 85% -10%,rgba(59,130,246,.18),transparent 60%),radial-gradient(900px 600px at -10% 110%,rgba(34,240,160,.12),transparent 60%),#05070b}
.scene{position:absolute;inset:0;opacity:0}
.label{position:absolute;left:120px;top:44px;right:120px}
.label b{display:block;font-size:40px;font-weight:700;color:#22f0a0;letter-spacing:-.01em}
.label span{display:block;font-size:26px;color:#8b97a8;margin-top:6px}
.stage{position:absolute;left:120px;right:120px;top:170px;bottom:170px;display:flex;align-items:center;justify-content:center;gap:56px}
.browser{width:1380px;height:100%;border-radius:20px;overflow:hidden;background:#0b0f16;border:1px solid #1d2634;box-shadow:0 30px 90px rgba(0,0,0,.65);display:flex;flex-direction:column}
.bar{height:46px;background:#111722;display:flex;align-items:center;gap:10px;padding:0 18px;flex:none}
.bar i{width:13px;height:13px;border-radius:50%;background:#2a3446}
.url{margin-left:18px;background:#05070b;color:#8b97a8;border-radius:10px;padding:6px 16px;font-size:20px;flex:1}
.view{position:relative;flex:1;overflow:hidden;clip-path:inset(0)}
.view img{position:absolute;left:0;top:0;width:100%}
.view video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.phone{width:380px;height:100%;max-height:740px;border-radius:52px;background:#0b0f16;border:10px solid #1a2130;box-shadow:0 30px 90px rgba(0,0,0,.6);position:relative;overflow:hidden}
.phone .notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:28px;border-radius:20px;background:#05070b;z-index:2}
.pview{position:absolute;inset:0;overflow:hidden;clip-path:inset(0 round 40px)}.pview img{width:100%;position:absolute;left:0;top:0}
.side{max-width:760px;display:flex;flex-direction:column;gap:22px}
.side p{font-size:40px;line-height:1.25;font-weight:600;padding-left:28px;border-left:6px solid #22f0a0}
.split{display:flex;gap:48px;height:100%;width:100%}
.split figure{flex:1;display:flex;flex-direction:column;gap:16px}
.split img{width:100%;flex:1;object-fit:contain;object-position:center top;border-radius:18px;border:1px solid #1d2634;min-height:0}
.split figcaption{font-size:34px;font-weight:700;text-align:center;color:#e8b14c}
.card{display:flex;align-items:center;gap:70px;max-width:1500px}
.card .emoji{font-size:220px;line-height:1}
.card ul{list-style:none;display:flex;flex-direction:column;gap:28px}
.card li{font-size:50px;font-weight:650;line-height:1.2;padding-left:36px;position:relative}
.card li:before{content:"";position:absolute;left:0;top:.42em;width:16px;height:16px;border-radius:50%;background:#22f0a0}
.card ul.many{display:grid;grid-template-columns:1fr 1fr;column-gap:60px;row-gap:22px}.card ul.many li{font-size:42px}
.card ul.one li{font-size:72px;padding:0}.card ul.one li:before{display:none}
.flow{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;max-width:1600px}
.step{font-size:38px;font-weight:700;padding:26px 34px;border-radius:22px;background:#0b0f16;border:2px solid #1d2634;position:relative}
.step.on{border-color:#22f0a0;color:#fff;box-shadow:0 0 40px rgba(34,240,160,.18)}
.step.off{opacity:.45}
.tg{width:820px;height:100%;border-radius:26px;overflow:hidden;background:#0e1621;border:1px solid #1d2634;display:flex;flex-direction:column;box-shadow:0 30px 90px rgba(0,0,0,.6)}
.tghead{height:96px;background:#17212b;display:flex;align-items:center;gap:20px;padding:0 28px;flex:none}
.tghead .ava{width:60px;height:60px;border-radius:50%;background:#3b82f6;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700}
.tghead b{display:block;font-size:30px}.tghead span{font-size:22px;color:#8b97a8}
.tgbody{flex:1;padding:28px;display:flex;flex-direction:column;gap:18px;justify-content:flex-end;
 background:linear-gradient(180deg,#0e1621,#0b131c)}
.msg{white-space:pre-line;max-width:78%;font-size:32px;line-height:1.3;padding:16px 22px;border-radius:22px}
.msg.me{align-self:flex-end;background:#2b5278;border-bottom-right-radius:6px}
.msg.them{align-self:flex-start;background:#182533;border-bottom-left-radius:6px}
.msg.circle{background:none;padding:0;border-radius:50%}.circle{width:230px;height:230px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#3b82f6,#13304e);display:flex;align-items:center;justify-content:center;border:5px solid #22f0a0}
.circle img{width:110px}
.voice{display:flex;align-items:center;gap:16px}.voice b{width:52px;height:52px;border-radius:50%;background:#5b9bff;display:flex;align-items:center;justify-content:center;font-size:24px}
.voice i{width:230px;height:26px;background:repeating-linear-gradient(90deg,#8fb6e8 0 4px,transparent 4px 9px);opacity:.8}
.voice em{font-style:normal;font-size:22px;color:#c6d6ea}
.task{max-width:1500px;padding:56px 64px;border-radius:30px;background:#0b0f16;border:2px solid #e8b14c}
.task .tk{font-size:30px;color:#e8b14c;font-weight:700;margin-bottom:24px;text-transform:uppercase;letter-spacing:.08em}
.task p{font-size:44px;line-height:1.3;font-weight:600}.task p.uz{font-size:32px;color:#8b97a8;font-weight:500;margin-top:22px}
.title{display:flex;flex-direction:column;justify-content:center;padding:0 160px}
.title .logo{width:120px;margin-bottom:40px}
.title .kicker{font-size:30px;color:#22f0a0;font-weight:700;margin-bottom:26px}
.title h1{font-size:96px;line-height:1.05;font-weight:800;letter-spacing:-.03em;max-width:1500px}
.title h2{font-size:44px;color:#8b97a8;font-weight:500;margin-top:30px;max-width:1500px}
.pause{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px}
.ring{position:relative;width:260px;height:260px}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:14}.ring .bg{stroke:#1d2634}.ring .fg{stroke:#e8b14c;stroke-dasharray:553;stroke-linecap:round}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:96px}
.pause h3{font-size:58px;font-weight:800}.pause h4{font-size:36px;color:#8b97a8;font-weight:500}
.remember{padding:110px 160px}
.remember .rk{font-size:40px;color:#22f0a0;font-weight:800;margin-bottom:50px}
.remember ol{list-style:none;display:flex;flex-direction:column;gap:40px}
.remember li{display:flex;gap:36px;align-items:flex-start}
.remember li b{flex:none;width:84px;height:84px;border-radius:50%;background:#22f0a0;color:#05070b;font-size:46px;display:flex;align-items:center;justify-content:center}
.remember li p{font-size:42px;font-weight:650;line-height:1.25}.remember li p.uz{font-size:30px;color:#8b97a8;font-weight:500;margin-top:8px}
.sub{position:absolute;left:140px;right:140px;bottom:46px;text-align:center;font-size:40px;font-weight:600;line-height:1.32;opacity:0;z-index:50}
.sub span{background:rgba(5,7,11,.86);color:#fff;padding:6px 20px;border-radius:12px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.wm{position:absolute;right:40px;bottom:14px;font-size:18px;color:#5b6779;z-index:60}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="__TOTAL__" data-width="1920" data-height="1080">
<audio id="narr" src="narration.wav" data-start="0" data-duration="__TOTAL__" data-volume="1"></audio>
__SCENES__
__SUBS__
<div class="wm">DevUz · только для команды</div>
</div>
<script>
const tl=gsap.timeline({paused:true});
__ANIM__
window.__timelines=window.__timelines||{};window.__timelines["main"]=tl;tl.seek(0);
</script></body></html>
