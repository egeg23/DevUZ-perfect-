# Блок хостового nginx для devuz.maximov-tech.ru
#
# Кладётся на сервере в /etc/nginx/sites-available/devuz.maximov-tech.ru и
# линкуется в sites-enabled. Строки с сертификатом дописывает certbot сам —
# сначала ставим этот файл без них, получаем сертификат, и certbot правит файл.

server {
    listen 80;
    listen [::]:80;
    server_name devuz.maximov-tech.ru;

    # Certbot подтверждает владение доменом через этот путь.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name devuz.maximov-tech.ru;

    # ssl_certificate и ssl_certificate_key сюда допишет certbot.

    # Приложение слушает петлевой интерфейс, снаружи недоступно.
    set $devuz_upstream 127.0.0.1:3310;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # Имена файлов сборки Next меняются вместе с содержимым, поэтому их можно
    # кэшировать навсегда.
    location /_next/static/ {
        proxy_pass http://$devuz_upstream;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://$devuz_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Лимитер частоты запросов берёт IP отсюда: без этого заголовка все
        # посетители выглядели бы как один клиент с адресом 127.0.0.1.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Ответ ассистента приходит потоком: буферизация склеила бы его в один
        # кусок, и вместо печатающегося текста посетитель ждал бы пустой экран.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
