# Блок хостового nginx для devuz.maximov-tech.ru
#
# Кладётся на сервере в /etc/nginx/sites-available/devuz.maximov-tech.ru и
# линкуется в sites-enabled. Строки с сертификатом дописывает certbot сам —
# сначала ставим этот файл без них, получаем сертификат, и certbot правит файл.
#
# ВНИМАНИЕ: четыре директивы limit_*_zone ниже должны лежать в http-контексте,
# то есть НЕ внутри server {}. Если этот файл подключается через include из
# nginx.conf (обычный случай для sites-enabled), они окажутся в http и всё
# заработает. Если nginx ругается «limit_req_zone directive is not allowed
# here» — перенесите эти четыре строки в /etc/nginx/nginx.conf внутрь http {}.

# Зоны учёта запросов по IP. 10 МБ хватает примерно на 160 тысяч адресов —
# многократный запас для сайта студии.
#
# Разные лимиты для разных вещей, потому что цена запроса разная. Обычная
# страница отдаётся из статики и почти ничего не стоит. Запрос в /api/chat
# поднимает разговор с моделью: он и дорогой в деньгах, и держит соединение
# до двадцати двух секунд, когда срабатывает гарантия. Вебхук Telegram
# защищён секретом, но пусть и он не станет способом нагрузить сервер.
limit_req_zone $binary_remote_addr zone=devuz_site:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=devuz_api:10m  rate=1r/s;
limit_req_zone $binary_remote_addr zone=devuz_hook:10m rate=5r/s;

# Одновременные соединения с одного адреса: обычному посетителю хватает
# нескольких, сотня означает либо скрипт, либо попытку исчерпать воркеры.
limit_conn_zone $binary_remote_addr zone=devuz_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name devuz.maximov-tech.ru;

    # Certbot подтверждает владение доменом через этот путь.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name devuz.maximov-tech.ru;

    # ssl_certificate и ssl_certificate_key сюда допишет certbot.

    # Версия nginx в заголовке Server и на страницах ошибок — бесплатная
    # подсказка тому, кто подбирает эксплойт под конкретный релиз.
    server_tokens off;

    # Тело запроса больше сотни килобайт этому сайту не нужно: самая крупная
    # форма — сообщение в чат на две тысячи символов.
    client_max_body_size 128k;

    # Медленные заголовки и тело — классический способ занять воркеры, ничего
    # при этом не отправляя. К проксированию ответа эти таймауты отношения не
    # имеют, поток от модели идёт под своими proxy_read_timeout.
    client_body_timeout 15s;
    client_header_timeout 15s;

    limit_conn devuz_conn 24;
    # Отдаём 429, а не 503: это честный код «слишком часто», и лимитер
    # приложения отвечает тем же.
    limit_req_status 429;
    limit_conn_status 429;

    # Приложение слушает петлевой интерфейс, снаружи недоступно.
    set $devuz_upstream 127.0.0.1:3310;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # Имена файлов сборки Next меняются вместе с содержимым, поэтому их можно
    # кэшировать навсегда.
    location /_next/static/ {
        proxy_pass http://$devuz_upstream;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Вебхук Telegram: свой лимит, чтобы шквал на него не съел квоту обычных
    # посетителей. Секрет в заголовке проверяет уже приложение.
    location = /api/telegram/webhook {
        limit_req zone=devuz_hook burst=20 nodelay;
        proxy_pass http://$devuz_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Разговор с моделью — самое дорогое, что тут есть. burst=5 без nodelay
    # означает «очередь до пяти, дальше 429»: живой человек, который быстро
    # печатает, очереди не заметит, а скрипт упрётся сразу.
    location /api/ {
        limit_req zone=devuz_api burst=5;
        proxy_pass http://$devuz_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        limit_req zone=devuz_site burst=60 nodelay;
        proxy_pass http://$devuz_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Лимитер частоты запросов берёт IP отсюда: без этого заголовка все
        # посетители выглядели бы как один клиент с адресом 127.0.0.1.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Ответ ассистента приходит потоком: буферизация склеила бы его в один
        # кусок, и вместо печатающегося текста посетитель ждал бы пустой экран.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
