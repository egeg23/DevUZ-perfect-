# Картинки, шрифты и ролики сайта — без ограничения частоты запросов.
#
# 13.11.2026, разбор трафика: при быстрой загрузке главной 10 логотипов
# «Делали для» получили 429. Главная разом просит десятки файлов (логотипы,
# постеры, шрифты, предзагрузку страниц), а в HTTP/2 каждый запрос считается
# отдельным соединением для limit_conn (24 на адрес). В Узбекистане много
# людей выходят в сеть с одного адреса оператора, им предел ещё теснее.
# Отдать файл стоит дёшево; дорогие пути (/api/, чат, вебхук) лимиты держат
# как прежде — этот блок их не касается: регулярное правило ниже ловит только
# расширения файлов, а /api/ отвечает JSON без них.
#
# Ставит scripts/vps-deploy.sh в /etc/nginx/snippets/devuz-extra/.
location ~* ^/(?!api/|admin|_next/)[^?]*\.(?:webp|avif|png|jpe?g|gif|svg|ico|woff2?|mp4|webm)$ {
    limit_conn devuz_conn 200;
    proxy_pass http://$devuz_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
