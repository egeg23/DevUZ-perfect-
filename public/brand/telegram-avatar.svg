<svg xmlns="http://www.w3.org/2000/svg" viewBox="-112 -112 224 224" width="512" height="512">
  <!--
    Аватар DevUz для Telegram.

    Та же айдентика, что на сайте: восьмиконечная звезда «Руб-эль-Хизб» —
    объединение двух квадратов, повёрнутых на 45°, — с градиентом от синего
    к зелёному, вырезанными в негативе `<` и `>` и золотым курсором между
    ними. Фон — «чернила» сайта.

    Поле то же, что у знака на сайте: Telegram обрезает аватар в круг, и при
    радиусе звезды 100 на поле 112 лучи занимают 89 % круга — знак уверенно
    заполняет кружок, но не упирается в срез. Шире поле — знак теряется в
    списке чатов, уже — лучи режутся.
  -->
  <defs>
    <linearGradient id="mark" x1="0" y1="-1" x2="1" y2="1">
      <stop offset="0" stop-color="#5B9BFF"/>
      <stop offset="55%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22F0A0"/>
    </linearGradient>

    <!-- Подсветка за знаком: та же, что держит тёмный фон сайта живым. -->
    <radialGradient id="glow" cx="50%" cy="44%" r="60%">
      <stop offset="0" stop-color="#13304e" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#05070B" stop-opacity="0"/>
    </radialGradient>

    <mask id="cut">
      <rect x="-112" y="-112" width="224" height="224" fill="#fff"/>
      <path d="M-22 -34 L-58 0 L-22 34" stroke="#000" stroke-width="15" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M22 -34 L58 0 L22 34" stroke="#000" stroke-width="15" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>

  <rect x="-112" y="-112" width="224" height="224" fill="#05070B"/>
  <rect x="-112" y="-112" width="224" height="224" fill="url(#glow)"/>

  <path
    d="M0 -100 L29.29 -70.71 L70.71 -70.71 L70.71 -29.29 L100 0 L70.71 29.29 L70.71 70.71 L29.29 70.71 L0 100 L-29.29 70.71 L-70.71 70.71 L-70.71 29.29 L-100 0 L-70.71 -29.29 L-70.71 -70.71 L-29.29 -70.71 Z"
    fill="url(#mark)"
    mask="url(#cut)"
  />

  <rect x="-5" y="-27" width="10" height="54" rx="5" fill="#E8B14C"/>
</svg>
