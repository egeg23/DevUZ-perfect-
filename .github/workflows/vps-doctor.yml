# Осмотр связи «GitHub → сервер → GitHub», по кнопке.
#
# Заводится после 20 сентября, когда на вопрос «у нас отвалился коннект с
# гитхаб» не нашлось ни одного места, где ответ был бы виден. Выкатка
# показывает только последний запуск, health — только выкаченный коммит, а
# всё остальное (чем сервер ходит за кодом, жив ли ключ, не отстал ли
# рабочий каталог) можно было узнать единственным способом: зайти руками.
#
# Осмотр ничего не чинит и ничего не меняет: только смотрит и рассказывает.
# Запускается со вкладки Actions → «Осмотр связи с сервером» → Run workflow.
name: Осмотр связи с сервером

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctor:
    name: Осмотр сервера
    runs-on: ubuntu-latest
    steps:
      - name: Осмотреть сервер по SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          # Намеренно без set -e: осмотр обязан дойти до конца и показать
          # все находки сразу. Провал одной проверки — не повод скрыть
          # остальные девять, ради которых сюда и пришли.
          script: |
            set -uo pipefail

            APP_DIR="${{ secrets.VPS_APP_DIR || '/opt/devuz' }}"
            BRANCH=main
            TROUBLE=0

            # Те же две строки, что и в выкатке, и по той же причине: без
            # них git с мёртвым доступом ждёт логин, которого никто не
            # введёт, и осмотр висит до таймаута вместо ответа.
            export GIT_TERMINAL_PROMPT=0
            export GIT_SSH_COMMAND="ssh -o BatchMode=yes -o ConnectTimeout=10"
            unset HTTPS_PROXY HTTP_PROXY ALL_PROXY https_proxy http_proxy all_proxy

            echo "════ Каталог приложения ════"
            if [ -d "$APP_DIR/.git" ]; then
              echo "✓ $APP_DIR на месте"
              cd "$APP_DIR"
            else
              echo "✗ $APP_DIR не репозиторий — выкатке некуда забирать код"
              exit 1
            fi

            echo
            echo "════ Чем сервер ходит за кодом ════"
            ORIGIN_URL="$(git config --get remote.origin.url 2>/dev/null || true)"
            echo "origin: ${ORIGIN_URL:-(не задан)}"
            case "$ORIGIN_URL" in
              https://*) echo "  · по HTTPS: ключ не нужен, протухать нечему" ;;
              git@*|ssh://*) echo "  · по SSH: нужен живой ключ на сервере — именно он и кончается по сроку" ;;
              *) echo "  · адрес незнакомого вида" ;;
            esac

            echo
            echo "════ Чтение из GitHub ════"
            if git ls-remote --heads origin "$BRANCH" >/dev/null 2>&1; then
              echo "✓ origin отвечает — выкатка заберёт код обычным путём"
            else
              echo "✗ origin не отвечает: доступ сервера к GitHub закончился"
              TROUBLE=1
            fi

            case "$ORIGIN_URL" in
              git@github.com:*)       FALLBACK="https://github.com/${ORIGIN_URL#git@github.com:}" ;;
              ssh://git@github.com/*) FALLBACK="https://github.com/${ORIGIN_URL#ssh://git@github.com/}" ;;
              https://*)              FALLBACK="$ORIGIN_URL" ;;
              *)                      FALLBACK="" ;;
            esac
            if [ -n "$FALLBACK" ] && git ls-remote --heads "$FALLBACK" "$BRANCH" >/dev/null 2>&1; then
              echo "✓ запасной путь по HTTPS открыт — выкатка доедет, даже если ключ умрёт"
            else
              echo "✗ запасной путь по HTTPS закрыт: ${FALLBACK:-адрес не вывести}"
              TROUBLE=1
            fi

            echo
            echo "════ Запись в GitHub (пробный push, ничего не создаёт) ════"
            if git push --dry-run origin "HEAD:refs/heads/deploy-doctor-probe" >/dev/null 2>&1; then
              echo "✓ право записи есть"
            else
              echo "· права записи нет. Для выкатки оно и не нужно — нужно, только если с сервера кто-то пушит"
            fi

            echo
            echo "════ Отставание от GitHub ════"
            LOCAL="$(git rev-parse --short HEAD 2>/dev/null || echo '?')"
            REMOTE="$(git ls-remote origin "refs/heads/$BRANCH" 2>/dev/null | cut -c1-7)"
            [ -n "$REMOTE" ] || REMOTE="$(git ls-remote "$FALLBACK" "refs/heads/$BRANCH" 2>/dev/null | cut -c1-7)"
            echo "на сервере: $LOCAL, в GitHub: ${REMOTE:-неизвестно}"
            if [ -n "$REMOTE" ] && [ "$LOCAL" != "$REMOTE" ]; then
              echo "✗ сервер отстал — последняя выкатка не доехала"
              TROUBLE=1
            elif [ -n "$REMOTE" ]; then
              echo "✓ сервер стоит на том же коммите, что и $BRANCH"
            fi

            echo
            echo "════ Приложение ════"
            docker compose ps --format '{{.Name}}: {{.State}} ({{.Status}})' 2>/dev/null || docker compose ps 2>/dev/null || echo "· docker compose не ответил"
            APP_PORT="$(grep -m1 '^APP_PORT=' .env 2>/dev/null | cut -d= -f2- || true)"
            HEALTH="$(curl -sS --max-time 20 "http://127.0.0.1:${APP_PORT:-3310}/api/health" 2>/dev/null || true)"
            if [ -n "$HEALTH" ]; then
              echo "health: $HEALTH"
            else
              echo "✗ приложение не отвечает на петлевом интерфейсе"
              TROUBLE=1
            fi

            echo
            echo "════ Модель с хоста — тем же путём, что у скаута ════"
            # Сайт ходит к модели из контейнера, скаут — с хоста и через
            # прокси из .env. Это два разных пути, и 21 сентября разница
            # стоила дня: чат на сайте отвечал, а «разобрано 0» у скаута
            # выглядело так же, как кончившиеся деньги.
            #
            # Ключ подставляется заголовком и в вывод не попадает ни при
            # каком исходе: печатаются только код ответа и вид ошибки.
            KEY="$(grep -m1 '^ANTHROPIC_API_KEY=' .env 2>/dev/null | cut -d= -f2- | tr -d '"'"'"'"' )"
            # Модель берём ту же, какой пользуется скаут: у него своя
            # переменная, и проверка чужой модели ничего бы не доказала.
            MODEL="$(grep -m1 '^SCOUT_MODEL=' .env 2>/dev/null | cut -d= -f2- | tr -d '"'"'"'"' )"
            [ -n "$MODEL" ] || MODEL="$(grep -m1 '^ANTHROPIC_MODEL=' .env 2>/dev/null | cut -d= -f2- | tr -d '"'"'"'"' )"
            PROXY="$(grep -m1 '^HTTPS_PROXY=' .env 2>/dev/null | cut -d= -f2- | tr -d '"'"'"'"' )"
            if [ -z "$KEY" ]; then
              echo "✗ ANTHROPIC_API_KEY в .env не найден — модель не позовёт никто"
              TROUBLE=1
            else
              PROBE=/tmp/devuz-model-probe.json
              CODE="$(HTTPS_PROXY="$PROXY" https_proxy="$PROXY" curl -sS -o "$PROBE" -w '%{http_code}' --max-time 40 \
                https://api.anthropic.com/v1/messages \
                -H "x-api-key: $KEY" \
                -H "anthropic-version: 2023-06-01" \
                -H "content-type: application/json" \
                -d "{\"model\":\"${MODEL:-claude-opus-5}\",\"max_tokens\":1,\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}]}" 2>/dev/null || echo 000)"
              KIND="$(grep -o '\"type\":\"[a-z_]*\"' "$PROBE" 2>/dev/null | head -2 | tail -1)"
              rm -f "$PROBE"
              case "$CODE" in
                200) echo "✓ модель отвечает: ключ, деньги и прокси на месте" ;;
                400) echo "✗ модель отказала ($KIND). Чаще всего это кончившиеся деньги на ключе"; TROUBLE=1 ;;
                401|403) echo "✗ ключ не принят ($CODE) — проверьте ANTHROPIC_API_KEY"; TROUBLE=1 ;;
                429) echo "· модель ограничивает частоту (429) — это не поломка" ;;
                000) echo "✗ до api.anthropic.com не достучались с хоста: прокси или сеть. Скаут в этом состоянии читает чаты, но ничего не разбирает"; TROUBLE=1 ;;
                *) echo "✗ модель ответила $CODE $KIND"; TROUBLE=1 ;;
              esac
            fi

            echo
            echo "════ Фоновые службы ════"
            for unit in devuz-bot.service devuz-scout.service devuz-backup.timer devuz-reminders.timer; do
              echo "$unit: $(systemctl is-active "$unit" 2>/dev/null || echo 'нет')"
            done

            echo
            echo "════ Скаут: что читает ════"
            # Последний старт: сколько чатов открыл и в каких не состоит.
            journalctl -u devuz-scout.service --since "-7d" --no-pager 2>/dev/null \
              | grep -E "scout: (открыл|аккаунт не состоит|не открыл)" | tail -4 || echo "· журнал скаута пуст"
            echo
            echo "════ Бэкап базы ════"
            LAST_BACKUP="$(ls -1t /var/backups/devuz 2>/dev/null | head -1)"
            if [ -n "$LAST_BACKUP" ]; then
              echo "последний: $LAST_BACKUP ($(stat -c %y "/var/backups/devuz/$LAST_BACKUP" 2>/dev/null | cut -d. -f1))"
            else
              echo "✗ бэкапов в /var/backups/devuz нет"
              TROUBLE=1
            fi
            systemctl list-timers devuz-backup.timer --no-pager 2>/dev/null | sed -n 2p || true
            echo
            echo "════ Ошибки приложения за сутки ════"
            # Только то, что код сам пишет как неудачу: «не сохранил», «не
            # записал», «не отправил», ошибки базы и модели.
            docker compose logs --since 24h --no-color 2>/dev/null \
              | grep -E "не (сохранил|записал|прочитал|отправил|подготовил|завёл)|violates|ERROR|Error:|разбор не удался|не ответил" \
              | sed -E 's/^[^|]*\| //' | cut -c1-220 | sort | uniq -c | sort -rn | head -25 || true
            echo
            echo "════ Свип за сутки ════"
            # Не «fail» вообще: в каждом отчёте свипа есть "failed":0, и такой
            # фильтр насчитал бы сбой в каждом из 288 проходов. Считаем то,
            # что пишет systemd и curl, когда проход действительно упал.
            SWEEP_FAILS="$(journalctl -u devuz-reminders.service --since "-24h" --no-pager 2>/dev/null \
              | grep -cE "Failed with result|curl: \(" || true)"
            echo "упавших проходов: ${SWEEP_FAILS:-0}"
            echo
            echo "════ Бот ════"
            # Изнутри контейнера: там токен и адрес API, а в вывод токен не попадает.
            docker compose exec -T web node -e "const b=(process.env.TELEGRAM_API_BASE||'https://api.telegram.org').replace(/\/+$/,'');fetch(b+'/bot'+process.env.TELEGRAM_BOT_TOKEN+'/getWebhookInfo').then(r=>r.json()).then(j=>{const r=j.result||{};console.log('вебхук:',r.url?new URL(r.url).host:'не задан','· ждут доставки:',r.pending_update_count,'· последняя ошибка:',r.last_error_message||'нет',r.last_error_date?new Date(r.last_error_date*1000).toISOString():'')}).catch(e=>console.log('· Telegram не ответил:',e.message))" 2>/dev/null || echo "· проверить бота не вышло"
            echo
            echo "════ Место на диске ════"
            # Кончившееся место выглядит как что угодно, только не как
            # кончившееся место: docker build падает на середине, а причина
            # уезжает в середину лога.
            df -h "$APP_DIR" | tail -1

            echo
            if [ "$TROUBLE" = "0" ]; then
              echo "✓ Связь цела: код доезжает, сайт отвечает."
            else
              echo "✗ Осмотр нашёл поломки — они помечены выше знаком ✗."
              exit 1
            fi
