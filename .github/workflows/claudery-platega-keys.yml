# Ключи Platega для бота Claudery — с сервера AI-юриста в наше хранилище.
#
# Владелец, 17.11.2026: «А токены вытащи сам от аи юриста с сервера».
# AI-юрист (egeg23/seller-ai) живёт на том же сервере, его ключи — строки
# PLATEGA_MERCHANT_ID и PLATEGA_API_KEY в /opt/seller-ai-v3/.env. Задача
# берёт их у живого AI-юриста (окружение контейнера, иначе .env), проверяет,
# что Platega их принимает (в лог — только код ответа), и кладёт в хранилище секретов Supabase
# (app.PLATEGA_MERCHANT_ID, app.PLATEGA_API_KEY — функция app_secret_put),
# откуда их берёт lib/claudery/store.ts. Значения никуда не печатаются:
# в лог идёт только «задано / пусто». Журнал задачи публичный.
#
# Запуск: Actions → «Claudery: ключи Platega» → Run workflow.
name: "Claudery: ключи Platega"

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  keys:
    name: Перенести ключи Platega
    runs-on: ubuntu-latest
    steps:
      - name: Ключи с сервера AI-юриста в хранилище
        uses: appleboy/ssh-action@v1
        env:
          VPS_APP_DIR_IN: ${{ secrets.VPS_APP_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: VPS_APP_DIR_IN
          command_timeout: 5m
          script: |
            set -uo pipefail
            APP_DIR="${VPS_APP_DIR_IN:-/opt/devuz}"
            val() { grep -m1 "^$2=" "$1" 2>/dev/null | cut -d= -f2- | sed -E "s/^[\"']//; s/[\"']\$//"; }

            # Код ответа Platega на вопрос о несуществующем платеже: 401/403 — ключи
            # не приняты, любой другой — приняты. Значения — через stdin, не в аргументах.
            probe() {
              printf 'url = "https://app.platega.io/transaction/00000000-0000-4000-8000-000000000000"\nheader = "X-MerchantId: %s"\nheader = "X-Secret: %s"\nheader = "Accept: application/json"\n' "$1" "$2" \
                | curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --noproxy '*' -K - 2>/dev/null || echo 000
            }
            accepted() { case "$1" in 401|403|000) return 1;; *) return 0;; esac; }

            MID=""; KEY=""; FROM=""
            try() {
              local from="$1" mid="$2" key="$3" code
              [ -n "$mid" ] && [ -n "$key" ] || { echo "· $from: ключей нет"; return 1; }
              code="$(probe "$mid" "$key")"
              echo "· $from: Platega ответила $code"
              accepted "$code" || return 1
              MID="$mid"; KEY="$key"; FROM="$from"
            }

            # 1) Живые сервисы владельца (Seller AI первым): окружение контейнеров —
            #    то, чем они платят на деле. Владелец, 18.11.2026: «возьми селлер аи,
            #    это тоже мой продукт, там ключи свежие».
            for c in $(docker ps --format '{{.Names}}' 2>/dev/null | grep -v -i -E '^devuz' | sort | awk '{ print (/seller/ ? 0 : 1) " " $0 }' | sort | cut -d' ' -f2- || true); do
              [ -z "$FROM" ] || break
              E="$(docker exec "$c" printenv 2>/dev/null || true)"
              printf '%s\n' "$E" | grep -q '^PLATEGA_API_KEY=.' || continue
              try "контейнер $c" "$(printf '%s\n' "$E" | grep -m1 '^PLATEGA_MERCHANT_ID=' | cut -d= -f2-)" "$(printf '%s\n' "$E" | grep -m1 '^PLATEGA_API_KEY=' | cut -d= -f2-)" || true
            done
            # 2) Файлы .env — если контейнеров нет или в них пусто.
            for f in /opt/seller-ai-v3/.env /opt/seller*/.env* /opt/*/.env /opt/*/.env.prod* /home/*/*/.env; do
              [ -z "$FROM" ] || break
              [ -f "$f" ] && [ -r "$f" ] || continue
              case "$f" in *.example|*.sample|"$APP_DIR"/*) continue;; esac
              grep -q '^PLATEGA_API_KEY=.' "$f" 2>/dev/null || continue
              try "файл $f" "$(val "$f" PLATEGA_MERCHANT_ID)" "$(val "$f" PLATEGA_API_KEY)" || true
            done
            [ -n "$FROM" ] || { echo "✗ ключей, которые Platega принимает, на сервере не нашлось"; exit 1; }
            echo "✓ рабочие ключи: $FROM"

            SB_URL="$(val "$APP_DIR/.env" NEXT_PUBLIC_SUPABASE_URL)"
            SB_KEY="$(val "$APP_DIR/.env" SUPABASE_SERVICE_ROLE_KEY)"
            [ -n "$SB_URL" ] && [ -n "$SB_KEY" ] || { echo "✗ в .env devuz нет адреса или ключа базы"; exit 1; }

            put() {
              local name="$1" value="$2"
              # Значение — через stdin (-K -) и JSON из node: его нет ни в выводе, ни в списке процессов.
              BODY="$(NAME="app.$name" VALUE="$value" node -e 'process.stdout.write(JSON.stringify({p_name:process.env.NAME,p_value:process.env.VALUE}))')"
              CODE="$(printf 'url = "%s/rest/v1/rpc/app_secret_put"\nheader = "apikey: %s"\nheader = "Authorization: Bearer %s"\nheader = "Content-Type: application/json"\n' "$SB_URL" "$SB_KEY" "$SB_KEY" \
                | curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --noproxy '*' -K - --data-binary @<(printf '%s' "$BODY") 2>/dev/null || true)"
              case "$CODE" in 2*) echo "✓ $name: задано";; *) echo "✗ $name: база ответила $CODE"; return 1;; esac
            }

            OK=0
            put PLATEGA_MERCHANT_ID "$MID" || OK=1
            put PLATEGA_API_KEY "$KEY" || OK=1
            exit $OK
