name: Deploy to VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "supabase/**"
  # Тот же набор проверок на pull request. Без этого PR мержится вслепую:
  # сборка и тесты прогонялись только после слияния, то есть на боевой ветке,
  # и сломанный код обнаруживался там, где чинить его дороже всего.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Две выкатки одновременно на один сервер устроили бы гонку за docker build.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

# Готовый образ сайта живёт в реестре GitHub, а не собирается на сервере.
#
# 07.10.2026 пять выкаток подряд собирали Next.js прямо на боевом VPS, где
# кроме devuz.studio живут ещё полтора десятка сайтов клиентов. Каждая
# сборка на несколько минут забирала весь процессор: сайт, бот и прототипы
# отвечали через раз, свип напоминаний не укладывался в минуту, запросы к
# базе обрывались. Одну выкатку GitHub ещё и потерял, её запустили снова, и
# две сборки шли рядом. Теперь сборка — здесь, на раннере GitHub, а сервер
# только забирает готовый образ: секунды вместо минут и ноль нагрузки.
#
# Значения NEXT_PUBLIC_* вшиваются в образ на сборке. Все четыре — открытые:
# они лежат в html каждой страницы сайта. Переменные репозитория (Settings →
# Variables) переопределяют значения по умолчанию ниже; .env на сервере
# остаётся истиной — выкатка сверяет образ с ним и при расхождении собирает
# сама, как раньше.
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/devuz
  PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://devuz.studio' }}
  PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://owbkqoyutubqujdazdcc.supabase.co' }}
  PUBLIC_METRIKA_ID: ${{ vars.NEXT_PUBLIC_YANDEX_METRIKA_ID || '112925960' }}
  PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID || 'G-L52MCVNS0W' }}

jobs:
  build-check:
    name: Сборка и проверка типов
    runs-on: ubuntu-latest
    # Записать образ в реестр может только задача из этого репозитория; на
    # pull request образ собирается, но не публикуется (см. push ниже).
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # Тесты до сборки: они секундные и без сети, а ловят то, что типы не
      # ловят, — сумму весов скоринга и разметку брифа, из-за которой Telegram
      # молча отвергает сообщение целиком.
      - run: npm test

      # Короткий хеш — тот же, что пишет на сервере git rev-parse --short:
      # /api/health показывает его, и по нему проверяют, что выкатка доехала.
      - id: meta
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Тот же Dockerfile, что собирал сервер: образ один и тот же, только
      # собран здесь. Кэш слоёв в GitHub — чтобы npm ci не шёл с нуля на
      # каждой выкатке.
      #
      # Метка studio.devuz.public — подпись вшитых открытых значений. Сервер
      # сверяет её со своим .env перед тем, как взять образ: расходятся —
      # собирает сам, и на сайт не уедут чужие Метрика или адрес.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          # Метка по хешу — всегда; «main» — только с main. У pull request
          # имя ссылки вида «265/merge», и с косой чертой метка образа не
          # собирается вовсе: первый же прогон на PR упал именно на этом.
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:main', env.IMAGE) || '' }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.PUBLIC_SITE_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ env.PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_YANDEX_METRIKA_ID=${{ env.PUBLIC_METRIKA_ID }}
            NEXT_PUBLIC_GA_ID=${{ env.PUBLIC_GA_ID }}
            GIT_COMMIT=${{ steps.meta.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            studio.devuz.public=${{ env.PUBLIC_SITE_URL }}|${{ env.PUBLIC_SUPABASE_URL }}|${{ env.PUBLIC_METRIKA_ID }}|${{ env.PUBLIC_GA_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Выкатка на VPS
    needs: build-check
    # Выкатывается только push в main. Без этого условия добавленный выше
    # триггер pull_request отправлял бы на боевой сервер любую ветку, из
    # которой кто-нибудь открыл PR, — включая чужую.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Токен уезжает на сервер запасным ключом к выкачке, поэтому пусть умеет
    # только читать. По умолчанию у него есть и запись — отдавать наружу
    # больше прав, чем нужно для git fetch, незачем.
    permissions:
      contents: read
      # Этим же токеном сервер забирает образ из реестра.
      packages: read
    steps:
      - name: Запустить деплой по SSH
        uses: appleboy/ssh-action@v1
        env:
          # Ключ на один запуск: истекает вместе с задачей и на сервере не
          # остаётся. Им сервер входит в реестр за образом; для выкачки кода
          # он нужен только тому дню, когда репозиторий закроют.
          DEPLOY_TOKEN: ${{ github.token }}
          DEPLOY_ACTOR: ${{ github.actor }}
          # Какой образ брать. Пусто (запуск руками на сервере) — сервер
          # собирает сам, как раньше.
          DEPLOY_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: DEPLOY_TOKEN,DEPLOY_ACTOR,DEPLOY_IMAGE
          # По умолчанию у действия 10 минут на всю команду. 07.10.2026 сборка
          # на сервере дважды не уложилась: страницы «Разборов» ждали базу и
          # получали «fetch failed», сборка дошла до конца, а команду уже
          # оборвало «Run Command Timeout» — сайт остался на старом коммите.
          command_timeout: 25m
          # Здесь стоял script_stop: true, и он ничего не делал. Действие
          # такого входа не знает и молча его игнорирует — предупреждение
          # «Unexpected input(s) 'script_stop'» лежало в каждом логе выкатки.
          # Остановку на первой же ошибке даёт set в самом скрипте, а не вход
          # действия, поэтому она написана здесь явно.
          script: |
            set -euo pipefail
            export APP_DIR="${{ secrets.VPS_APP_DIR || '/opt/devuz' }}"
            export BRANCH=main
            bash "$APP_DIR/scripts/vps-deploy.sh"

  # Упавшая выкатка обязана будить владельца, а не ждать, пока он откроет
  # вкладку Actions.
  #
  # Цена молчания уже заплачена: работа от 19 сентября простояла в ветке
  # сутки, сайт всё это время показывал позавчерашний коммит, и со стороны
  # это выглядело как «отвалился коннект с гитхаб». Красный значок на
  # странице, куда никто не заходит, — это не уведомление.
  #
  # Канал тот же, которым отчитываются ночные смены: строка в shift_reports
  # через маршрут сайта, дальше свип доносит её в Telegram за пять минут.
  # Отдельного бота заводить незачем — этот уже работает и проверен.
  alarm:
    name: Сказать владельцу, что выкатка не доехала
    needs: [build-check, deploy]
    # failure() здесь про любую из двух задач: не собралось — на сервер тоже
    # ничего не уехало. На pull request не тревожим: красный PR видит тот,
    # кто его открыл, и будить владельца ночью незачем.
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Строка владельцу
        env:
          SHIFT_REPORT_SECRET: ${{ secrets.SHIFT_REPORT_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://devuz.studio' }}
        run: |
          set -uo pipefail

          # Через :- потому что set -u: секрета нет — переменной может не
          # оказаться вовсе, и шаг упал бы на проверке того, что его нет.
          if [ -z "${SHIFT_REPORT_SECRET:-}" ]; then
            echo "SHIFT_REPORT_SECRET не задан в секретах репозитория — владелец о падении не узнает." >&2
            echo "Заведите секрет с тем же значением, что и в .env на сервере: Settings → Secrets → Actions." >&2
            exit 0
          fi

          RUN="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          BODY="Выкатка ${GITHUB_SHA:0:7} не доехала до сервера: сайт остался на прошлом коммите. Лог: $RUN"

          # Тревога не имеет права ронять задачу: её дело — сказать. Не
          # сказалось (сайт лежит, секрет разошёлся) — это видно в логе, а
          # выкатка и без того красная.
          curl -sS --max-time 30 -X POST "$SITE_URL/api/shift/report" \
            -H "x-devuz-shift: $SHIFT_REPORT_SECRET" \
            -H "content-type: application/json" \
            --data "$(jq -n --arg body "$BODY" '{shift: "deploy", body: $body}')" \
            || echo "строка не ушла — сайт не ответил" >&2
