# Голосовые → текст: владелец или руководитель пересылает голосовое боту
# студии, здесь его расшифровывают, текст бот присылает в тот же чат
# (lib/admin/voice-notes.ts, scripts/voice-transcribe.py).
#
# Здесь, а не на сервере: модель расшифровки тяжёлая, а на боевом сервере
# живут ещё полтора десятка сайтов (CLAUDE.md, «Сервер не собирает сайт»).
# Модель — открытая Whisper (faster-whisper), платной модели нет.
#
# Раз в 10 минут задача спрашивает очередь; пусто — заканчивается за секунды,
# модель не качает. Журнал виден всем (репозиторий открытый), поэтому ни
# слова из расшифровки сюда не пишется — только номер, длина и число знаков.
name: Голосовые — расшифровка

on:
  workflow_dispatch:
    inputs:
      model:
        description: Модель Whisper
        required: false
        default: large-v3-turbo
      language:
        description: Язык (ru, uz…); пусто — модель узнаёт сама
        required: false
        default: ""
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: voice-transcribe
  cancel-in-progress: false

jobs:
  transcribe:
    name: Расшифровать
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VOICE_SITE: ${{ secrets.SITE_URL || 'https://devuz.studio' }}
      VOICE_SECRET: ${{ secrets.SHIFT_REPORT_SECRET }}
      VOICE_MODEL: ${{ inputs.model || 'large-v3-turbo' }}
      VOICE_LANGUAGE: ${{ inputs.language || '' }}
    steps:
      - name: Есть ли голосовые
        id: queue
        run: |
          set -uo pipefail
          site="${VOICE_SITE%/}"
          # Сайт не ответил (выкатка, перезапуск) — не красим задачу: через
          # 10 минут следующий проход, а красная каждые 10 минут — шум в почте.
          if body=$(curl -fsS --max-time 30 -H "x-devuz-shift: $VOICE_SECRET" "$site/api/voice/queue"); then
            n=$(printf '%s' "$body" | jq '.items | length')
          else
            echo "::warning::Очередь голосовых не ответила"
            n=0
          fi
          echo "В очереди: $n"
          echo "count=$n" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.queue.outputs.count != '0'

      - uses: actions/setup-python@v5
        if: steps.queue.outputs.count != '0'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/voice-transcribe.yml

      - name: Модель — из кэша
        if: steps.queue.outputs.count != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ env.VOICE_MODEL }}-v1

      - name: Поставить faster-whisper
        if: steps.queue.outputs.count != '0'
        run: pip install --quiet "faster-whisper==1.2.1"

      - name: Расшифровать и отдать боту
        if: steps.queue.outputs.count != '0'
        run: python scripts/voice-transcribe.py
