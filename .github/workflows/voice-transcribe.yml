# Голосовые → текст: владелец или руководитель пересылает голосовое боту
# студии, здесь его расшифровывают, текст бот присылает в тот же чат
# (lib/admin/voice-notes.ts, scripts/voice-transcribe.py).
#
# Здесь, а не на сервере: модель расшифровки тяжёлая, а на боевом сервере
# живут ещё полтора десятка сайтов (CLAUDE.md, «Сервер не собирает сайт»).
# Модель — открытая Whisper (faster-whisper), платной модели нет.
#
# Раз в 10 минут задача спрашивает очередь; пусто — заканчивается за секунды,
# модель не качает. Журнал виден всем (репозиторий открытый), поэтому ни
# слова из расшифровки сюда не пишется — только номер, длина и число знаков.
name: Голосовые — расшифровка

on:
  workflow_dispatch:
    inputs:
      model:
        description: Модель Whisper
        required: false
        default: large-v3-turbo
      language:
        description: Язык (ru, uz…); пусто — модель узнаёт сама
        required: false
        default: ""
  schedule:
    - cron: "*/10 * * * *"

# id-token — пропуск GitHub (OIDC) к очереди: общий секрет смен в секретах
# репозитория пуст, а переносить его с сервера в открытый репозиторий нельзя.
# Сервер пускает только эту задачу с ветки main (lib/admin/voice-auth.ts).
permissions:
  contents: read
  id-token: write

concurrency:
  group: voice-transcribe
  cancel-in-progress: false

jobs:
  transcribe:
    name: Расшифровать
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Адрес — не секрет: в секрете SITE_URL он прячется в журнале за «***»,
      # и по предупреждению не понять, куда задача ходила.
      VOICE_SITE: https://devuz.studio
      VOICE_MODEL: ${{ inputs.model || 'large-v3-turbo' }}
      VOICE_LANGUAGE: ${{ inputs.language || '' }}
    steps:
      - name: Есть ли голосовые
        id: queue
        run: |
          set -uo pipefail
          site="${VOICE_SITE%/}"
          # Сайт не ответил (выкатка, перезапуск) — не красим задачу: через
          # 10 минут следующий проход, а красная каждые 10 минут — шум в почте.
          # Пропуск живёт минуты — его просят заново перед каждым запросом
          # (и скрипт расшифровки тоже). В журнал он не попадает.
          token=$(curl -sS --max-time 20 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=devuz-voice" | jq -r '.value // empty' || true)
          [ -n "$token" ] && echo "::add-mask::$token"
          # Код ответа — в предупреждение: журнал отсюда не скачать, а
          # предупреждение видно в сводке задачи. 403 — пропуск не принят,
          # 000 — сайт не ответил.
          code=$(curl -sS --max-time 30 -o "$RUNNER_TEMP/queue.json" -w '%{http_code}' \
            -H "Authorization: Bearer $token" "$site/api/voice/queue" || true)
          if [ "$code" = "200" ]; then
            n=$(jq '.items | length' "$RUNNER_TEMP/queue.json")
          else
            pass=$([ -n "$token" ] && echo "получен" || echo "не получен")
            echo "::warning::Очередь голосовых не ответила: HTTP ${code:-000}, пропуск GitHub ${pass}"
            n=0
          fi
          echo "В очереди: $n"
          echo "count=$n" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.queue.outputs.count != '0'

      - uses: actions/setup-python@v5
        if: steps.queue.outputs.count != '0'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/voice-transcribe.yml

      - name: Модель — из кэша
        if: steps.queue.outputs.count != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ env.VOICE_MODEL }}-v1

      - name: Поставить faster-whisper
        if: steps.queue.outputs.count != '0'
        # av — та версия, на которой расшифровка проверена: свежий PyAV упал
        # TypeError в av.open — faster-whisper передаёт ему metadata_errors
        # (первое голосовое, 14.10.2026).
        run: pip install --quiet "faster-whisper==1.2.1" "av==18.1.0"

      - name: Расшифровать и отдать боту
        if: steps.queue.outputs.count != '0'
        run: python scripts/voice-transcribe.py
