# Боевой сайт CZECHFARM (ООО «MIR-PHARM UNITED») — на сервере компании, не на
# нашем (владелец, 10.11.2026: клиент оплатил, «приводим в боевой вид, всё по
# смете»; сервер — компании). Сайт на четырёх языках, панель (обращения,
# продукты, новости, комната инвестора, ключи Telegram, amoCRM и Bitrix24) и
# Telegram-бот — один образ.
#
# Правило «Сервер не собирает сайт» то же, что у нас: страницы собирает
# GitHub (CF_PROD=1 node gen.mjs), образы кладёт в ghcr.io, сервер компании их
# только скачивает и запускает (scripts/protos/chechfarm/app/deploy/remote.sh).
#
# Выкатка идёт, только когда заведена переменная репозитория CZECHFARM_DOMAIN
# и секреты CZECHFARM_HOST, CZECHFARM_USER, CZECHFARM_SSH_KEY (порт —
# CZECHFARM_PORT, код первого входа — CZECHFARM_SETUP_CODE, ключ кадров сцены —
# CZECHFARM_SCENE_KEY). Что попросить у компании —
# scripts/protos/chechfarm/app/README.md. Репозиторий открытый: журнал задачи
# видят все, поэтому ключи и код установки в него не печатаются.
name: "Сайт CZECHFARM: сервер компании"

on:
  push:
    branches: [main]
    paths:
      - "scripts/protos/chechfarm/**"
      - "public/protos/chechfarm/**"
      - ".github/workflows/czechfarm-app.yml"
  # На pull request — та же сборка без отправки образов и без выкатки.
  pull_request:
    branches: [main]
    paths:
      - "scripts/protos/chechfarm/**"
      - "public/protos/chechfarm/**"
      - ".github/workflows/czechfarm-app.yml"
  workflow_dispatch:
    inputs:
      front:
        description: "HTTPS: auto — Caddy, если 80/443 свободны, иначе nginx компании"
        type: choice
        options: [auto, caddy, nginx, none]
        default: auto

permissions:
  contents: read

concurrency:
  group: czechfarm-app
  cancel-in-progress: false

env:
  APP: ghcr.io/${{ github.repository_owner }}/czechfarm-app
  CADDY: ghcr.io/${{ github.repository_owner }}/czechfarm-caddy

jobs:
  build:
    name: Сборка сайта и образов
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      caddy: ${{ steps.tag.outputs.caddy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Страницы боевого сайта
        run: |
          CF_PROD=1 node scripts/protos/chechfarm/gen.mjs
          mkdir -p scripts/protos/chechfarm/app/site/protos
          cp -r public/protos/chechfarm scripts/protos/chechfarm/app/site/protos/
          du -sh scripts/protos/chechfarm/app/site
      - name: Сервер отдаёт сайт и панель
        working-directory: scripts/protos/chechfarm/app
        run: |
          DATA_DIR="$RUNNER_TEMP/cf" APP_SECRET=ci-secret-not-for-prod COMMIT=ci PORT=3999 node server.mjs > "$RUNNER_TEMP/cf.log" 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3999/api/health && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:3999/ | grep -q "CZECHFARM"
          curl -fsS http://127.0.0.1:3999/ar/ | grep -q 'dir="rtl"'
          curl -fsS http://127.0.0.1:3999/en/products | grep -q '"live":{'
          curl -fsS http://127.0.0.1:3999/admin | grep -q "/admin/app.js"
          curl -fsS -o /dev/null http://127.0.0.1:3999/protos/chechfarm/seq/p-d-0.webp
          curl -fsS http://127.0.0.1:3999/api/admin/state | grep -q '"setup":true'
          kill %1
      - name: Метка образа HTTPS
        id: tag
        run: echo "caddy=c-${{ hashFiles('scripts/protos/chechfarm/app/deploy/Caddyfile', 'scripts/protos/chechfarm/app/deploy/Caddy.Dockerfile') }}" | cut -c1-30 >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Образ сайта
        uses: docker/build-push-action@v6
        with:
          context: scripts/protos/chechfarm/app
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.APP }}:${{ github.sha }}
            ${{ env.APP }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=czechfarm-app
          cache-to: type=gha,mode=max,scope=czechfarm-app
      - name: Образ HTTPS (Caddy)
        uses: docker/build-push-action@v6
        with:
          context: scripts/protos/chechfarm/app/deploy
          file: scripts/protos/chechfarm/app/deploy/Caddy.Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.CADDY }}:${{ steps.tag.outputs.caddy }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  deploy:
    name: Запуск на сервере компании
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && vars.CZECHFARM_DOMAIN != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/protos/chechfarm/app/deploy
      - name: Скрипт выкатки
        id: script
        run: echo "b64=$(base64 -w0 scripts/protos/chechfarm/app/deploy/remote.sh)" >> "$GITHUB_OUTPUT"
      - name: Запуск по SSH
        uses: appleboy/ssh-action@v1
        env:
          CF_SCRIPT: ${{ steps.script.outputs.b64 }}
          CF_APP: ${{ env.APP }}:${{ github.sha }}
          CF_CADDY: ${{ env.CADDY }}:${{ needs.build.outputs.caddy }}
          CF_DOMAIN: ${{ vars.CZECHFARM_DOMAIN }}
          CF_PORT: ${{ vars.CZECHFARM_APP_PORT || '3000' }}
          CF_COMMIT: ${{ github.sha }}
          CF_SETUP: ${{ secrets.CZECHFARM_SETUP_CODE }}
          CF_SCENE: ${{ secrets.CZECHFARM_SCENE_KEY }}
          CF_FRONT: ${{ inputs.front || 'auto' }}
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.CZECHFARM_HOST }}
          username: ${{ secrets.CZECHFARM_USER }}
          key: ${{ secrets.CZECHFARM_SSH_KEY }}
          port: ${{ secrets.CZECHFARM_PORT || 22 }}
          envs: CF_SCRIPT,CF_APP,CF_CADDY,CF_DOMAIN,CF_PORT,CF_COMMIT,CF_SETUP,CF_SCENE,CF_FRONT,GH_TOKEN,GH_ACTOR
          command_timeout: 25m
          script: |
            set -euo pipefail
            F="$(mktemp)"; trap 'rm -f "$F"' EXIT
            printf '%s' "$CF_SCRIPT" | base64 -d > "$F"
            bash "$F"
