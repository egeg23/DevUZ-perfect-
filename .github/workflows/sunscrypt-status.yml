name: SUNSCRYPT — состояние движка

# Только чтение: что делает движок на сервере (кабинеты по первым 8 символам
# id, позиции, сделки, сверка, события; без почт и ключей — лог публичный).
on:
  workflow_dispatch:
  push:
    branches: [sunscrypt]
    paths: [.github/workflows/sunscrypt-status.yml]

jobs:
  status:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /opt/sunscrypt
            C="docker compose -p sunscrypt --env-file /opt/sunscrypt/.env -f infra/docker-compose.yml"
            $C ps --format '{{.Service}} {{.State}} {{.Status}}'
            $C exec -T backend python -m app.engine_report
            echo "▸ Текущие сигналы по парам:"
            for k in $($C exec -T redis redis-cli --raw keys 'sig:*'); do
              $C exec -T redis redis-cli --raw get "$k" | python3 -c "import sys,json,datetime;s=json.load(sys.stdin);print(' ',s['sym'],s.get('model'),'цель',s['target'],'от',datetime.datetime.utcfromtimestamp(s['ts_close']/1000).strftime('%m-%d %H:%M'),'пауза' if s.get('paused') else '')"
            done
            echo "▸ Сигналы (последние строки):"
            $C logs --tail 40 signals 2>&1 | grep -E "rhat|свечи|история|нет весов" | tail -10
            echo "▸ Диспетчер (последние строки):"
            $C logs --since 4h orchestrator 2>&1 | grep -E "WARN|ERROR|Traceback|Rejected|Denied|rejected|остановка" | grep -v "httpx" | tail -25
            echo "▸ Задачи по расписанию (наблюдение, копии, модель):"
            journalctl -t sunscrypt --since "-3h" --no-pager -o short-iso 2>/dev/null | grep -v "httpx\|HTTP Request" | tail -25 || true
            echo "▸ Telegram-бот:"
            $C logs --tail 50 bot 2>&1 | grep -E "tgbot|telegram|Traceback|Error" | tail -5
            echo "▸ Задача модели (контейнер trainer):"
            docker ps -a --filter name=sunscrypt-trainer --format '{{.Names}} {{.Status}}' || true
            T="$(docker ps -q --filter name=sunscrypt-trainer)"
            [ -n "$T" ] && docker stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}}' $T || echo "не запущена"
            echo "▸ Нехватка памяти (ядро, 3 ч):"
            journalctl -k --since "-3h" --no-pager 2>/dev/null | grep -i -E "out of memory|oom-kill|killed process" | tail -5 || true
