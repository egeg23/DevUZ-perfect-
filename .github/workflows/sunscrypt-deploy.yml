name: SUNSCRYPT — выкатка

# Каждый пуш в ветку sunscrypt уезжает на наш сервер (тот же, где
# devuz.studio). Ветка своя, с кодом DevUZ не связана и в main не сливается.
#
# Ключ SSH и адрес сервера — те же секреты репозитория, что у выкатки DevUZ
# (VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PORT). Секретов приложения здесь нет:
# они живут на сервере в /opt/sunscrypt/.env (infra/deploy.sh).

on:
  push:
    branches: [sunscrypt]
  workflow_dispatch:

# Две выкатки подряд не должны собирать образы наперегонки.
concurrency:
  group: deploy-sunscrypt
  cancel-in-progress: false

jobs:
  # ── Проверки: выкатка идёт, только если всё зелёное ──────────────────────
  backend:
    name: Backend — линтер и тесты
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sunscrypt
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: sunscrypt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sunscrypt" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://sunscrypt:ci@localhost:5432/sunscrypt
      REDIS_URL: redis://localhost:6379/0
      SUNSCRYPT_TEST_LIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Миграции вверх, вниз и снова вверх
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - run: pytest -q

  web:
    name: Сайт — линтер, типы, сборка
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  images:
    name: Сборка образов Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: docker compose build
        env:
          POSTGRES_PASSWORD: ci
        run: |
          docker compose -p sunscrypt -f infra/docker-compose.yml config -q
          docker compose -p sunscrypt -f infra/docker-compose.yml build

  deploy:
    name: Выкатка SUNSCRYPT на сервер
    needs: [backend, web, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Забрать ветку и запустить infra/deploy.sh по SSH
        uses: appleboy/ssh-action@v1
        env:
          SUNSCRYPT_TELEGRAM_TOKEN: ${{ secrets.SUNSCRYPT_TELEGRAM_TOKEN }}
          SUNSCRYPT_BYBIT_DEMO_API_KEY: ${{ secrets.SUNSCRYPT_BYBIT_DEMO_API_KEY }}
          SUNSCRYPT_BYBIT_DEMO_API_SECRET: ${{ secrets.SUNSCRYPT_BYBIT_DEMO_API_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 40m
          # Секреты владельца (SUNSCRYPT_*) — infra/deploy.sh пишет их в
          # /opt/sunscrypt/.env. Не заведён — придёт пустым, это нормально.
          envs: SUNSCRYPT_TELEGRAM_TOKEN,SUNSCRYPT_BYBIT_DEMO_API_KEY,SUNSCRYPT_BYBIT_DEMO_API_SECRET
          script: |
            set -euo pipefail
            # Прокси сервера — для приложений DevUZ, не для git и Docker Hub:
            # GitHub через него отвечает 403.
            unset HTTPS_PROXY HTTP_PROXY ALL_PROXY https_proxy http_proxy all_proxy
            export GIT_TERMINAL_PROMPT=0
            DIR=/opt/sunscrypt
            REPO=https://github.com/egeg23/DevUZ-perfect-.git
            if [ ! -d "$DIR/.git" ]; then
              mkdir -p "$DIR"
              git -C "$DIR" init -q
              git -C "$DIR" remote add origin "$REPO"
            fi
            cd "$DIR"
            git fetch --depth 1 origin sunscrypt
            git reset --hard -q origin/sunscrypt
            echo "▸ SUNSCRYPT $(git rev-parse --short HEAD)"
            bash infra/deploy.sh

  # Упавшая выкатка будит владельца тем же каналом, что и выкатка DevUZ:
  # строка в отчётах смен → Telegram.
  alarm:
    name: Сказать владельцу, что выкатка SUNSCRYPT не доехала
    needs: [backend, web, images, deploy]
    if: failure()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Строка владельцу
        env:
          SHIFT_REPORT_SECRET: ${{ secrets.SHIFT_REPORT_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://devuz.studio' }}
        run: |
          set -uo pipefail
          if [ -z "${SHIFT_REPORT_SECRET:-}" ]; then
            echo "SHIFT_REPORT_SECRET не задан — владелец о падении не узнает." >&2
            exit 0
          fi
          RUN="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          BODY="SUNSCRYPT: выкатка ${GITHUB_SHA:0:7} не доехала до сервера. Лог: $RUN"
          curl -sS --max-time 30 -X POST "$SITE_URL/api/shift/report" \
            -H "x-devuz-shift: $SHIFT_REPORT_SECRET" \
            -H "content-type: application/json" \
            --data "$(jq -n --arg body "$BODY" '{shift: "deploy", body: $body}')" \
            || echo "строка не ушла — сайт не ответил" >&2
