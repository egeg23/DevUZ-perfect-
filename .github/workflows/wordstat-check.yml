# Проверка ключа Вордстата на сервере — по кнопке.
#
# Владелец, 15.11.2026: «Яндекс Клауд оплатил, теперь ключи для вордстата
# должны работать, проверь». Скрипт берёт ключ тем же путём, что статьи,
# и печатает только статус, код и текст ошибки Яндекса и первые фразы.
# Сам ключ в публичный журнал не попадает. Сайт и сервер не меняет.
# «landings» — сверка запросов шести страниц услуг (scripts/seo/wordstat-landings.mjs).
# «tomsk» — запросы страниц сайта клиники «Сияние Севера» по Томску (регион 67), тот же скрипт.
# «planner» — те же шесть страниц по планировщику Google Ads, Узбекистан (scripts/seo/planner-landings.mjs).
# «site» — главная, кейсы, калькулятор, «О студии», коробка и лидогенерация, Россия и СНГ (тот же wordstat-landings.mjs).
name: Вордстат — проверить ключ

on:
  workflow_dispatch:
    inputs:
      what:
        description: "Что проверить: key — ключ, landings — запросы страниц услуг, tomsk — запросы сайта клиники по Томску, planner — страницы услуг по Google, site — главная, кейсы и разделы по России и СНГ"
        type: choice
        options: [key, landings, tomsk, planner, site]
        default: key

permissions:
  contents: read

jobs:
  check:
    name: Спросить Вордстат с сервера
    runs-on: ubuntu-latest
    steps:
      - name: Проверка по SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -uo pipefail
            cd "${{ secrets.VPS_APP_DIR || '/opt/devuz' }}"
            # Скрипт — из свежего main во временный файл, рабочую копию не трогаем.
            arg=""
            case "${{ inputs.what || 'key' }}" in
              landings) file=wordstat-landings.mjs ;;
              tomsk) file=wordstat-landings.mjs; arg=tomsk ;;
              site) file=wordstat-landings.mjs; arg=site ;;
              planner) file=planner-landings.mjs ;;
              *) file=wordstat-check.mjs ;;
            esac
            git fetch -q --depth 1 origin main && git show "origin/main:scripts/seo/$file" > "/tmp/$file" || exit 1
            set -a; . ./.env; set +a
            export NODE_OPTIONS=--use-env-proxy
            node --import ./tests/alias-hook.mjs "/tmp/$file" $arg
