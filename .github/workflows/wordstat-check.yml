# Проверка ключа Вордстата на сервере — по кнопке.
#
# Владелец, 15.11.2026: «Яндекс Клауд оплатил, теперь ключи для вордстата
# должны работать, проверь». Скрипт берёт ключ тем же путём, что статьи,
# и печатает только статус, код и текст ошибки Яндекса и первые фразы.
# Сам ключ в публичный журнал не попадает. Сайт и сервер не меняет.
name: Вордстат — проверить ключ

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Спросить Вордстат с сервера
    runs-on: ubuntu-latest
    steps:
      - name: Проверка по SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 5m
          script: |
            set -uo pipefail
            cd "${{ secrets.VPS_APP_DIR || '/opt/devuz' }}"
            # Скрипт — из свежего main во временный файл, рабочую копию не трогаем.
            git fetch -q --depth 1 origin main && git show origin/main:scripts/seo/wordstat-check.mjs > /tmp/wordstat-check.mjs || exit 1
            set -a; . ./.env; set +a
            export NODE_OPTIONS=--use-env-proxy
            node --import ./tests/alias-hook.mjs /tmp/wordstat-check.mjs
