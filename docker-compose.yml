# DevUz Studio на VPS.
#
#   cd /opt/devuz && docker compose up -d --build
#
# Контейнер слушает только петлевой интерфейс, а TLS и маршрутизацию берёт на
# себя хостовый nginx — та же схема, что у usta и остальных приложений на этом
# сервере. Свой reverse proxy здесь поднимать нельзя: он попытался бы занять
# порты 80 и 443 и уронил бы всё, что уже работает на этом VPS.

name: devuz

services:
  web:
    build:
      context: .
      args:
        # Переменные с префиксом NEXT_PUBLIC_ вшиваются в клиентский бандл на
        # этапе сборки, поэтому передаются аргументами. Секреты сюда попадать
        # не должны: всё, что видел билд, остаётся в слоях образа.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_YANDEX_METRIKA_ID: ${NEXT_PUBLIC_YANDEX_METRIKA_ID}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: devuz:latest
    container_name: devuz
    restart: unless-stopped

    # Наружу порт не выставляем: до приложения можно достучаться только с
    # самого сервера, то есть только через nginx, то есть только по HTTPS.
    ports:
      - "127.0.0.1:${APP_PORT:-3310}:3000"

    environment:
      # Читается в рантайме, в образ не попадает.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      # Разбор переписки моделью попроще: он не пишет клиенту, а вычитывает
      # факты из уже законченной ленты — переплачивать тут не за что.
      ANTHROPIC_REVIEW_MODEL: ${ANTHROPIC_REVIEW_MODEL:-claude-haiku-4-5}

      # Модели по узлам. Пусто — берётся выбранная в коде по замеру
      # 21 сентября: письма, разбор резюме и подсказки менеджеру на
      # Соннете (то же качество по нашим проверкам, вчетверо дешевле).
      OUTREACH_MODEL: ${OUTREACH_MODEL:-}
      HIRING_MODEL: ${HIRING_MODEL:-}
      COACH_MODEL: ${COACH_MODEL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_SALES_CHAT_ID: ${TELEGRAM_SALES_CHAT_ID}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}

      # Бриф с витрины: секрет, которым витрина подписывает запрос, чат
      # владельца для крупных заказов и порог. Пусто — см. .env.example.
      SHOWCASE_BRIEF_SECRET: ${SHOWCASE_BRIEF_SECRET:-}
      TELEGRAM_OWNER_CHAT_ID: ${TELEGRAM_OWNER_CHAT_ID:-}
      BRIEF_OWNER_ONLY_FROM_USD: ${BRIEF_OWNER_ONLY_FROM_USD:-10000}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

      # Общий секрет для /api/reminders/sweep — его дёргает таймер systemd
      # с самого сервера. Пусто — endpoint отказывает всем, включая таймер,
      # и напоминания просто не рассылаются. Обратное поведение («нет
      # секрета — пускаем всех») открыло бы адрес наружу ровно в тот день,
      # когда переменная не доедет до контейнера.
      REMINDER_SWEEP_SECRET: ${REMINDER_SWEEP_SECRET}
      SHIFT_REPORT_SECRET: ${SHIFT_REPORT_SECRET}

      # Канал оператора холодного поиска. Отдельный от чата отдела продаж
      # намеренно: там лежат брифы настоящих лидов, и смешивать их с
      # холодной лентой значит утопить первые во вторых. Пусто — скаут
      # ничего не рассылает, сигналы только копятся в базе.
      TELEGRAM_SCOUT_CHANNEL_ID: ${TELEGRAM_SCOUT_CHANNEL_ID}

      # Модель для разбора сообщений скаута. Пусто — берётся общая.
      SCOUT_MODEL: ${SCOUT_MODEL:-}
      RAZBOR_MODEL: ${RAZBOR_MODEL:-}
      # Чем смена определяет нишу вне каталога. Пусто — Sonnet: это один
      # короткий ответ на сайт, а не статья.
      RAZBOR_NICHE_MODEL: ${RAZBOR_NICHE_MODEL:-}

      # Порог, ниже которого сигнал скаута не показывают оператору.
      # Пусто — берётся значение по умолчанию из кода.
      SCOUT_MIN_SCORE: ${SCOUT_MIN_SCORE:-}

      # Каждый N-й разговор получает ответ на 22-й секунде и скидку. Это
      # решение про деньги, а не про код, поэтому переменная и заведена —
      # но без строки здесь она не доезжает до контейнера и значение в
      # .env молча игнорируется.
      PROMISE_MISS_EVERY: ${PROMISE_MISS_EVERY:-3}

      # Запасные адреса API на случай, если прямой хост станет недоступен.
      # Пусто — работаем по адресам по умолчанию.
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-}

      # Прокси для исходящих запросов. Нужен, если сервер стоит в стране,
      # которую Anthropic не обслуживает: запрос оттуда отвергается на
      # границе с 403, не доходя до API. Пусто — идём напрямую.
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-127.0.0.1,localhost}
      INDEXNOW_KEY: ${INDEXNOW_KEY}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION}
      YANDEX_VERIFICATION: ${YANDEX_VERIFICATION}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}

      # Реквизиты поставщика для счёта и договора. В git их нет намеренно:
      # репозиторий когда-нибудь отдадут подрядчику, а расчётный счёт в
      # открытом коде не лежит. Без строк здесь значения из .env молча
      # не доезжают до контейнера, и счёт печатается без реквизитов —
      # именно так это и сломалось в первый раз.
      INVOICE_TAX_ID: ${INVOICE_TAX_ID:-}
      INVOICE_TAX_ID_KIND: ${INVOICE_TAX_ID_KIND:-}
      INVOICE_BANK_NAME: ${INVOICE_BANK_NAME:-}
      INVOICE_BANK_ACCOUNT: ${INVOICE_BANK_ACCOUNT:-}
      INVOICE_BANK_MFO: ${INVOICE_BANK_MFO:-}
      INVOICE_BANK_SWIFT: ${INVOICE_BANK_SWIFT:-}
      INVOICE_BANK_ADDRESS: ${INVOICE_BANK_ADDRESS:-}
      INVOICE_PAYMENT_DAYS: ${INVOICE_PAYMENT_DAYS:-}

      # Ключ подписи ссылок на файлы заказа. Пусто — ссылки не выдаются.
      DOWNLOAD_SIGNING_SECRET: ${DOWNLOAD_SIGNING_SECRET:-}

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
